<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Profilo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#0c0c18;
  --surface:#12121e;
  --card:#18182a;
  --border:rgba(255,255,255,0.09);
  --border2:rgba(255,255,255,0.18);
  --text:#e4e4f4;
  --muted:#6a6a8a;
  --primary:#6c5ce7;
  --primary-h:#5a4bd1;
  --success:#00b894;
  --warn:#f39c12;
  --err:#e74c3c;
  --radius:10px;
  --radius-lg:14px;
  --font:'Inter',sans-serif;
  --font-ku:'Noto Sans Arabic',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.6}
[dir="rtl"]{font-family:var(--font-ku)}
[dir="rtl"] .fa-arrow-left::before{content:"\f061"}
[dir="rtl"] .fa-right-to-bracket::before{content:"\f2f5"}
[dir="rtl"] .fa-right-from-bracket::before{content:"\f2f6"}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit}
input,textarea{font-family:inherit}
img{max-width:100%}

/* ── LAYOUT ── */
#app{min-height:100dvh}
.wrap{max-width:460px;margin:0 auto;padding:0 16px}
.wrap-lg{max-width:960px;margin:0 auto;padding:0 16px}

/* ── NAVBAR ── */
.nav{
  position:sticky;top:0;z-index:90;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  height:54px;display:flex;align-items:center;
  justify-content:space-between;padding:0 16px;
}
.nav-logo{font-size:1.25rem;font-weight:800;color:var(--primary);cursor:pointer;letter-spacing:-.02em}
.nav-r{display:flex;align-items:center;gap:8px}
.nav-av{width:32px;height:32px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:#fff;cursor:pointer}
.lang-btn{padding:4px 10px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:.75rem;font-weight:700;cursor:pointer;transition:all .15s}
.lang-btn:hover{color:var(--text);border-color:var(--primary)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:var(--radius);font-size:.86rem;font-weight:600;border:none;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover:not(:disabled){background:var(--primary-h)}
.btn-s{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-s:hover:not(:disabled){border-color:var(--border2)}
.btn-g{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-g:hover:not(:disabled){color:var(--text)}
.btn-d{background:rgba(231,76,60,.1);color:var(--err);border:1px solid rgba(231,76,60,.25)}
.btn-d:hover:not(:disabled){background:rgba(231,76,60,.18)}
.btn-ok{background:var(--success);color:#fff}
.btn-ok:hover:not(:disabled){background:#009d7a}
.btn-google{background:#fff;color:#3c4043;border:1.5px solid #dadce0;font-weight:600;font-size:.86rem}
.btn-google:hover{background:#f8f9fa}
.btn-google img{width:17px;height:17px}
.btn-sm{padding:6px 12px;font-size:.78rem;border-radius:7px}
.btn-lg{padding:13px 24px;font-size:.92rem}
.btn-blk{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ── FORMS ── */
.fg{margin-bottom:15px}
.lbl{display:block;font-size:.73rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
[dir="rtl"] .lbl{letter-spacing:0}
.fi{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:11px 14px;color:var(--text);font-size:.9rem;outline:none;transition:border .15s}
.fi:focus{border-color:var(--primary)}
.fi::placeholder{color:var(--muted)}
textarea.fi{resize:vertical;min-height:82px}
.ig{position:relative}
.ig .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.8rem;pointer-events:none}
.ig input{padding-left:38px}
[dir="rtl"] .ig .ic{left:auto;right:13px}
[dir="rtl"] .ig input{padding-left:14px;padding-right:38px}
.fhint{font-size:.72rem;color:var(--muted);margin-top:4px}
.or-div{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.76rem;margin:14px 0}
.or-div::before,.or-div::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}

/* ── DIVIDER ── */
.sep{display:flex;align-items:center;gap:10px;margin:16px 0 13px}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--border)}
.sep-lbl{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;white-space:nowrap}
[dir="rtl"] .sep-lbl{letter-spacing:0}
.divl{height:1px;background:var(--border);margin:16px 0}

/* ── TOAST ── */
#tc{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column-reverse;gap:7px;width:calc(100% - 28px);max-width:340px;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 15px;display:flex;align-items:flex-start;gap:10px;font-size:.84rem;box-shadow:0 4px 20px rgba(0,0,0,.5);animation:tIn .28s ease;pointer-events:all}
.toast.rem{animation:tOut .2s ease forwards}
.tic{flex-shrink:0;margin-top:1px}
.toast-s .tic{color:var(--success)}.toast-e .tic{color:var(--err)}
.toast-i .tic{color:var(--primary)}.toast-w .tic{color:var(--warn)}
@keyframes tIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tOut{to{opacity:0;transform:translateY(8px)}}

/* ── MODAL ── */
.mbk{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;animation:bkIn .18s ease}
@keyframes bkIn{from{opacity:0}to{opacity:1}}
.mbox{background:var(--card);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:24px;width:100%;max-width:360px;position:relative;animation:mIn .25s ease}
@keyframes mIn{from{transform:scale(.93);opacity:0}to{transform:none;opacity:1}}
.mcl{position:absolute;top:12px;right:12px;width:27px;height:27px;border-radius:50%;background:rgba(255,255,255,.07);border:none;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.78rem}
[dir="rtl"] .mcl{right:auto;left:12px}
.mcl:hover{color:var(--text)}
.mttl{font-size:1rem;font-weight:800;margin-bottom:14px}
.tabs{display:flex;background:var(--surface);border-radius:var(--radius);padding:3px;margin-bottom:18px}
.tbn{flex:1;padding:8px;text-align:center;border-radius:8px;font-size:.82rem;font-weight:700;color:var(--muted);background:transparent;border:none;cursor:pointer;transition:all .15s}
.tbn.on{background:var(--card);color:var(--text)}

/* ── LANDING ── */
.land{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 16px;background:var(--bg)}
.land-logo{font-size:2.4rem;font-weight:900;color:var(--primary);display:block;letter-spacing:-.03em;margin-bottom:6px}
.land-tag{color:var(--muted);font-size:.9rem;margin-bottom:28px;text-align:center}
.auth-card{width:100%;max-width:390px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px 22px}

/* ── DASHBOARD ── */
.dash-hd{padding:22px 0 14px}
.dash-hi{font-size:1.35rem;font-weight:800;margin-bottom:2px}
.dash-sub{color:var(--muted);font-size:.84rem}
.pc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:15px;margin-bottom:10px;transition:border .15s}
.pc:hover{border-color:var(--border2)}
.pc-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pc-av{width:44px;height:44px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:800;color:#fff;flex-shrink:0}
.pc-inf{flex:1;min-width:0}
.pc-name{font-size:.92rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px}
.pc-usr{font-size:.75rem;color:var(--muted)}
.pc-tpl{font-size:.66rem;padding:2px 8px;border-radius:20px;font-weight:700;background:rgba(108,92,231,.12);color:var(--primary);white-space:nowrap;border:1px solid rgba(108,92,231,.2)}
.pc-acts{display:flex;gap:6px;flex-wrap:wrap}
.lim{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.lim-row{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:7px}
.lim-bar{height:4px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.lim-fill{height:100%;background:var(--primary);border-radius:4px;transition:width .4s}

/* ── CREATE/EDIT ── */
.cr-pg{padding-bottom:60px}
.pg-hd{padding:20px 0 0}
.pg-back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:.82rem;margin-bottom:10px;cursor:pointer;background:none;border:none;transition:color .15s}
.pg-back:hover{color:var(--text)}
.pg-h1{font-size:1.35rem;font-weight:800;margin-bottom:2px}
.pg-hint{color:var(--muted);font-size:.82rem}

/* ── TEMPLATES ── */
.tpl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cust-toggle{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;cursor:pointer;margin-bottom:12px}
.cust-toggle .lbl{margin:0}
.sw{position:relative;width:40px;height:22px;background:var(--border2);border-radius:20px;transition:background .15s;flex-shrink:0}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--primary)}
.sw.on::after{transform:translateX(18px)}
[dir="rtl"] .sw.on::after{transform:translateX(-18px)}
.color-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.color-fld{text-align:center}
.color-fld input[type=color]{width:100%;height:42px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;padding:3px}
.color-fld .lbl{margin-bottom:6px;font-size:.68rem}
.tpl-card{border-radius:var(--radius);border:2px solid var(--border);overflow:hidden;cursor:pointer;transition:border .15s}
.tpl-card.sel{border-color:var(--primary)}
.tpl-card:not(.sel):not(.lkd):hover{border-color:var(--border2)}
.tpl-card.lkd{cursor:default}
.tpl-prev{height:66px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;position:relative;background-size:cover;background-position:center}
.tpl-prev::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.38)}
.tpl-prev span{position:relative;z-index:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.tpl-meta{padding:7px 9px;background:rgba(0,0,0,.28)}
.tpl-nm{font-size:.74rem;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdg{display:inline-flex;align-items:center;gap:3px;font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:20px}
.bdg-f{background:rgba(0,184,148,.13);color:var(--success)}
.bdg-p{background:rgba(243,156,18,.13);color:var(--warn)}
.bdg-u{background:rgba(108,92,231,.13);color:var(--primary)}
.lk-ov{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.lk-ic{width:30px;height:30px;border-radius:50%;background:rgba(243,156,18,.15);border:1px solid rgba(243,156,18,.35);display:flex;align-items:center;justify-content:center;color:var(--warn);font-size:.78rem;cursor:pointer}

/* ── PUBLIC PROFILE ── */
.pub-pg{min-height:100dvh;position:relative;display:flex;flex-direction:column;align-items:center;padding:40px 16px 60px;overflow:hidden}
.pub-bgimg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.pub-bgoverlay{position:absolute;inset:0;opacity:.82;z-index:0}
.pub-in{position:relative;z-index:1}
.pub-in{width:100%;max-width:400px}
.pub-hd{text-align:center;margin-bottom:28px}
.pub-av{width:82px;height:82px;border-radius:50%;background:var(--p-av-bg,#21262d);color:var(--p-av-tx,#58a6ff);display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:900;margin:0 auto 13px;border:3px solid var(--p-btn-br,#30363d)}
.pub-name{font-family:var(--font);color:var(--p-tx,#f0f6fc);font-size:1.4rem;font-weight:900;margin-bottom:3px}
.pub-handle{color:var(--p-sub,#8b949e);font-size:.82rem}
.pub-bio{color:var(--p-sub,#8b949e);font-size:.88rem;margin-top:10px;line-height:1.65}
.pub-links{display:flex;flex-direction:column;gap:10px}
.pub-lnk{display:flex;align-items:center;gap:12px;padding:14px 17px;background:var(--p-btn-bg,#21262d);border:1.5px solid var(--p-btn-br,#30363d);border-radius:13px;color:var(--p-btn-tx,#f0f6fc);font-family:var(--font);font-size:.88rem;font-weight:700;text-decoration:none;transition:background .18s,transform .18s}
.pub-lnk:hover{background:var(--p-btn-hv,#30363d);transform:translateY(-2px)}
.pub-lic{width:33px;height:33px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.sn-ic{background:rgba(255,252,0,.15);color:#FFFC00}
.tk-ic{background:rgba(255,255,255,.1);color:#fff}
.fb-ic{background:rgba(24,119,242,.15);color:#1877F2}
.tg-ic{background:rgba(0,136,204,.15);color:#0088CC}
.ig-ic{background:rgba(228,64,95,.15);color:#E4405F}
.pub-ft{text-align:center;margin-top:40px;color:var(--p-sub,#8b949e);font-size:.72rem}
.pub-ft a{color:var(--p-acc,#58a6ff);font-weight:700}

/* ── QR ── */
.qr-wrap{text-align:center}
#qr-cv{display:flex;align-items:center;justify-content:center;padding:13px;background:#fff;border-radius:var(--radius);margin:13px 0}
.qr-url{font-size:.73rem;color:var(--muted);word-break:break-all;margin-bottom:13px;padding:8px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border)}
.qr-acts{display:flex;gap:7px}

/* ── PAYMENT ── */
.pay-box{background:rgba(108,92,231,.07);border:1px solid rgba(108,92,231,.2);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.pay-ttl{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--primary);margin-bottom:5px}
[dir="rtl"] .pay-ttl{letter-spacing:0}
.pay-num{font-size:1.5rem;font-weight:900}
.pay-step{display:flex;gap:11px;margin-bottom:12px}
.ps-n{width:24px;height:24px;min-width:24px;border-radius:50%;background:rgba(108,92,231,.15);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:900;margin-top:2px}
.ps-t{font-size:.84rem;color:var(--muted);line-height:1.55;padding-top:3px}
.mth-sel{display:flex;gap:9px;margin-bottom:14px}
.mth-btn{flex:1;padding:13px;border-radius:var(--radius);border:2px solid var(--border);background:transparent;color:var(--muted);font-weight:700;font-size:.86rem;cursor:pointer;transition:all .15s;text-align:center}
.mth-btn.on{border-color:var(--primary);background:rgba(108,92,231,.1);color:var(--primary)}
.upd{border:2px dashed var(--border);border-radius:var(--radius);padding:26px 16px;text-align:center;cursor:pointer;transition:border .15s,background .15s;position:relative}
.upd:hover,.upd.dg{border-color:var(--primary);background:rgba(108,92,231,.05)}
.upd input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
#upd-prev{max-width:160px;margin:10px auto 0;border-radius:var(--radius);display:none}

/* ── ADMIN ── */
.adm-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.st-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.st-n{font-size:1.8rem;font-weight:900;color:var(--primary);line-height:1;margin-bottom:3px}
.st-l{font-size:.7rem;color:var(--muted);font-weight:700}
.adm-tabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.at-btn{padding:7px 14px;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:.78rem;font-weight:700;cursor:pointer;transition:all .15s}
.at-btn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.tbl-wrap{border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;overflow-x:auto;-webkit-overflow-scrolling:touch}
table.dt{width:100%;border-collapse:collapse;font-size:.82rem}
.dt th{text-align:left;padding:10px 12px;color:var(--muted);font-size:.67rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap}
[dir="rtl"] .dt th{text-align:right;letter-spacing:0}
.dt td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.dt tr:last-child td{border-bottom:none}
.dt tbody tr:hover td{background:rgba(255,255,255,.02)}
.sb{padding:2px 8px;border-radius:20px;font-size:.68rem;font-weight:800}
.sb-pend{background:rgba(243,156,18,.12);color:var(--warn)}
.sb-ok{background:rgba(0,184,148,.12);color:var(--success)}
.sb-rej{background:rgba(231,76,60,.12);color:var(--err)}

/* ── LOADER / EMPTY ── */
.pg-ld{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;color:var(--muted);font-size:.86rem}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:46px 20px}
.empty-e{font-size:3rem;margin-bottom:11px}
.empty-t{font-size:1rem;font-weight:700;margin-bottom:6px}
.empty-s{color:var(--muted);font-size:.84rem;margin-bottom:18px}

/* ── UTILS ── */
.hid{display:none!important}
.flex-1{flex:1}
.row{display:flex;align-items:center}
.tc{text-align:center}
.tm{color:var(--muted)}
.ts{font-size:.82rem}
.fw{font-weight:700}
.mt3{margin-top:12px}
.mt4{margin-top:16px}
.mb4{margin-bottom:16px}
.g2{gap:8px}

/* ── RESPONSIVE ── */
@media(min-width:560px){
  .adm-stats{grid-template-columns:repeat(4,1fr)}
  .tpl-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:360px){.pc-acts .btn{font-size:.72rem;padding:5px 9px}}
</style>
</head>

  route=pts[0]||''; param=pts[1]||''; param2=pts[2]||'';

/* ── AUTH STATE ── */
const _t=setTimeout(()=>{ if(S.loading){S.loading=false;handleRoute()} },8000);
let _udUnsub=null;
auth.onAuthStateChanged(async u=>{
  clearTimeout(_t); S.loading=false;
  if(_udUnsub){_udUnsub();_udUnsub=null}
  if(u){
    S.user=u; await loadUD(u.uid);
    // Live-sync: the instant admin approves an order, unlockedTemplates / extraProfilesPaid
    // update here automatically — no manual refresh needed.
    _udUnsub=db.collection('users').doc(u.uid).onSnapshot(doc=>{
      if(!doc.exists) return;
      const prevUnlocked=(S.ud?.unlockedTemplates||[]).length;
      const prevExtra=S.ud?.extraProfilesPaid;
      S.ud=doc.data();
      const newUnlocked=(S.ud.unlockedTemplates||[]).length;
      if(newUnlocked>prevUnlocked || (S.ud.extraProfilesPaid&&!prevExtra)){
        toast(lang==='ku'?'داواکارییەکەت پەسەندکرا! ئێستا کراوەتەوە 🎉':'Your order was approved — unlocked now! 🎉','s');
      }
      if(route==='dashboard') render();
      else if((route==='create'||route==='edit') && document.getElementById('tg')){
        document.getElementById('tg').innerHTML=tplGrid();
      }
    });
  } else {
    S.user=null; S.ud=null;
  }
  handleRoute();
});

async function loadUD(uid){
  try{
    const ref=db.collection('users').doc(uid);
    const d=await ref.get();
    const freshIsAdmin=S.user.email===ADMIN_EMAIL;
    if(d.exists){
      S.ud=d.data();
      // Keep email/displayName/isAdmin always in sync (fixes blank email for Google sign-ins
      // on accounts created before this field existed, or after a name/email change)
      const patch={};
      if(S.ud.email!==S.user.email) patch.email=S.user.email;
      if(!S.ud.displayName && S.user.displayName) patch.displayName=S.user.displayName;
      if(S.ud.isAdmin!==freshIsAdmin) patch.isAdmin=freshIsAdmin;
      if(Object.keys(patch).length){
        await ref.set(patch,{merge:true});
        S.ud={...S.ud,...patch};
      }
    } else {
      const nd={email:S.user.email,displayName:S.user.displayName||'',
        profileCount:0,unlockedTemplates:[],extraProfilesPaid:false,
        isAdmin:freshIsAdmin,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()};
      await ref.set(nd); S.ud=nd;
    }
  }catch(e){console.error('loadUD:',e)}
}

async function doLogin(em,pw){
  try{await auth.signInWithEmailAndPassword(em,pw);toast(t('welcomeBack'),'s');go('dashboard');}
  catch(e){toast(aerr(e.code),'e')}
}
async function doReg(nm,em,pw){
  try{
    const c=await auth.createUserWithEmailAndPassword(em,pw);
    await c.user.updateProfile({displayName:nm});
    S.user=c.user;await loadUD(c.user.uid);
    toast(t('accCreated'),'s');go('dashboard');
  }catch(e){toast(aerr(e.code),'e')}
}
async function doGoogle(){
  try{
    const p=new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters({prompt:'select_account'});
    const r=await auth.signInWithPopup(p);
    S.user=r.user;await loadUD(r.user.uid);
    toast(r.additionalUserInfo?.isNewUser?t('accCreated'):t('welcomeBack'),'s');
    go('dashboard');
  }catch(e){if(e.code!=='auth/popup-closed-by-user')toast(aerr(e.code),'e')}
}
async function doLogout(){await auth.signOut();go('');toast(t('loggedOut'),'i')}
function aerr(c){
  return({'auth/user-not-found':'No account with that email.','auth/wrong-password':'Incorrect password.',
    'auth/invalid-credential':'Invalid email or password.','auth/email-already-in-use':'Email already registered.',
    'auth/weak-password':'Password must be 6+ characters.','auth/invalid-email':'Invalid email address.',
    'auth/too-many-requests':'Too many attempts. Try again later.',
    'auth/popup-blocked':'Popup blocked — allow popups and retry.',
  })[c]||'Something went wrong. Try again.';
}

async function ckUN(un){const d=await db.collection('usernames').doc(un).get();return !d.exists}

async function createProfile(data){
  const uid=S.user.uid,ud=S.ud||{};
  const max=ud.extraProfilesPaid?FREE_LIMIT+2:FREE_LIMIT;
  if((ud.profileCount||0)>=max){toast(t('limitReached')+` (${max})`,'e');return null}
  const un=data.username.toLowerCase().trim();
  if(!await ckUN(un)){toast(t('unTaken'),'e');return null}
  try{
    const ref=db.collection('profiles').doc();
    const pd={id:ref.id,userId:uid,username:un,displayName:data.displayName||'',bio:data.bio||'',
      template:data.template,snapchat:data.snapchat||'',tiktok:data.tiktok||'',
      facebook:data.facebook||'',telegram:data.telegram||'',instagram:data.instagram||'',
      customBg:data.customBg||'',customText:data.customText||'',customBtn:data.customBtn||'',
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
    const b=db.batch();
    b.set(ref,pd);
    b.set(db.collection('usernames').doc(un),{uid,profileId:ref.id});
    b.update(db.collection('users').doc(uid),{profileCount:firebase.firestore.FieldValue.increment(1)});
    await b.commit();
    S.ud.profileCount=(S.ud.profileCount||0)+1;
    toast(t('profCreated'),'s');return ref.id;
  }catch(e){console.error(e);toast('Failed to create profile.','e');return null}
}

async function updProfile(pid,data,oldUN){
  try{
    const b=db.batch();
    if(data.username&&data.username!==oldUN){
      if(!await ckUN(data.username)){toast(t('unTaken'),'e');return false}
      b.delete(db.collection('usernames').doc(oldUN));
      b.set(db.collection('usernames').doc(data.username),{uid:S.user.uid,profileId:pid});
    }
    b.update(db.collection('profiles').doc(pid),{...data,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    await b.commit();toast(t('saved'),'s');return true;
  }catch(e){console.error(e);toast('Update failed.','e');return false}
}

async function delProfile(pid){
  try{
    const d=(await db.collection('profiles').doc(pid).get()).data();
    const b=db.batch();
    b.delete(db.collection('profiles').doc(pid));
    b.delete(db.collection('usernames').doc(d.username));
    b.update(db.collection('users').doc(S.user.uid),{profileCount:firebase.firestore.FieldValue.increment(-1)});
    await b.commit();
    S.ud.profileCount=Math.max(0,(S.ud.profileCount||0)-1);
    toast(t('profDeleted'),'i');
  }catch(e){console.error(e);toast('Delete failed.','e')}
}

async function getUserProfiles(uid){
  const s=await db.collection('profiles').where('userId','==',uid).get();
  return s.docs.map(d=>({id:d.id,...d.data()}))
    .sort((a,b)=>(b.createdAt?.toMillis()||0)-(a.createdAt?.toMillis()||0));
}
async function getProfileByUN(un){
  const s=await db.collection('profiles').where('username','==',un.toLowerCase()).limit(1).get();
  return s.empty?null:{id:s.docs[0].id,...s.docs[0].data()};
}

/* ══════════════════════════════════════
   IMAGE COMPRESS + PAYMENT
══════════════════════════════════════ */
function compressImage(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();r.onerror=rej;
    r.onload=e=>{
      const img=new Image();img.onerror=rej;
      img.onload=()=>{
        const MAX=900;let w=img.width,h=img.height;
        if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX}}
        else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX}}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        res(cv.toDataURL('image/jpeg',.65));
      };img.src=e.target.result;
    };r.readAsDataURL(file);
  });
}

async function submitPayment({nm,ph,method,type,tplId,file}){
  try{
    toast(t('compressing'),'i');
    const b64=await compressImage(file);
    if(b64.length>950000){toast(t('tooLarge'),'e');return null}
    const oid=db.collection('orders').doc().id;
    await db.collection('orders').doc(oid).set({
      id:oid,userId:S.user.uid,userEmail:S.user.email,userName:nm,phone:ph,
      paymentMethod:method,type,templateId:tplId||null,
      screenshotBase64:b64,status:'pending',
      amount:type==='template'?TPL_PRICE:XTRA_PRICE,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    const typeText=type==='template'?`Template (${tplId})`:'Extra Profile Slot';
    const msg=encodeURIComponent(`🟣 *New Profilo Payment*\n\n👤 ${nm}\n📧 ${S.user.email}\n📱 ${ph}\n💰 ${typeText}\n💳 ${method.toUpperCase()}\n🆔 ${oid}\n\nPlease check admin panel.`);
    window.open(`https://wa.me/${ADMIN_WA}?text=${msg}`,'_blank');
    toast(t('submitted'),'s');return oid;
  }catch(e){console.error(e);toast('Submission failed.','e');return null}
}

function showQR(username){
  const url=`${location.origin}${location.pathname}#/p/${username}`;
  modal(`<div class="qr-wrap">
    <button class="mcl" onclick="closeMdl()"><i class="fas fa-times"></i></button>
    <div class="mttl">📱 ${t('qrCode')}</div>
    <div id="qr-cv"></div>
    <div class="qr-url">${url}</div>
    <div class="qr-acts">
      <button class="btn btn-p flex-1" onclick="dlQR('${username}')"><i class="fas fa-download"></i> ${t('download')}</button>
      <button class="btn btn-s" onclick="cpLink('${url}')"><i class="fas fa-copy"></i> ${t('copy')}</button>
    </div>
  </div>`);
  setTimeout(()=>{
    const el=document.getElementById('qr-cv');
    if(el){el.innerHTML='';new QRCode(el,{text:url,width:188,height:188,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.H})}
  },120);
}
function dlQR(username){
  const cvs=document.querySelector('#qr-cv canvas');
  if(!cvs){toast('QR not ready.','e');return}
  const sz=600,off=document.createElement('canvas');off.width=sz;off.height=sz;
  const ctx=off.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,sz,sz);
  ctx.drawImage(cvs,50,50,sz-100,sz-100);
  ctx.fillStyle='#555';ctx.font='bold 20px Inter,sans-serif';ctx.textAlign='center';
  ctx.fillText('@'+username,sz/2,sz-16);
  const a=document.createElement('a');a.download=`profilo-${username}-qr.png`;a.href=off.toDataURL('image/png');a.click();
  toast(t('qrDl'),'s');
}
function cpLink(url){
  navigator.clipboard.writeText(url).then(()=>toast(t('linkCopied'),'s')).catch(()=>toast('Copy failed.','e'));
}

function toast(msg,type='i'){
  const ic={s:'fa-circle-check',e:'fa-circle-xmark',i:'fa-circle-info',w:'fa-triangle-exclamation'};
  const el=document.createElement('div');el.className=`toast toast-${type}`;
  el.innerHTML=`<i class="fas ${ic[type]} tic"></i><span>${msg}</span>`;
  document.getElementById('tc').appendChild(el);
  setTimeout(()=>{el.classList.add('rem');setTimeout(()=>el.remove(),220)},3600);
}

async function renderPub(username){
  document.getElementById('app').innerHTML='<div class="pg-ld"><div class="spin"></div></div>';
  if(!username){notFound(username);return}
  try{
    const p=await getProfileByUN(username);
    if(!p){notFound(username);return}
    const tpl=getTpl(p.template);
    const init=ini(p.displayName||p.username);
    const vars={...tpl.v};
    if(p.customBg)  { vars['--p-bg']=p.customBg; vars['--p-av-bg']=p.customBg; }
    if(p.customText){ vars['--p-tx']=p.customText; vars['--p-sub']=p.customText+'b3'; }
    if(p.customBtn) {
      vars['--p-btn-br']=p.customBtn; vars['--p-acc']=p.customBtn; vars['--p-av-tx']=p.customBtn;
      vars['--p-btn-bg']=p.customBtn+'1f'; vars['--p-btn-hv']=p.customBtn+'33'; vars['--p-btn-tx']=p.customText||tpl.v['--p-tx'];
    }
    const css=Object.entries(vars).map(([k,val])=>`${k}:${val}`).join(';');
    const overlayBg=p.customBg||tpl.v['--p-bg'];
    const socs=[
      p.snapchat&&{url:`https://snapchat.com/add/${p.snapchat}`,lbl:t('snapchat'),sub:p.snapchat,icon:'fab fa-snapchat',ic:'sn-ic'},
      p.tiktok&&  {url:`https://tiktok.com/@${p.tiktok}`,     lbl:t('tiktok'),  sub:p.tiktok,  icon:'fab fa-tiktok', ic:'tk-ic'},
      p.facebook&& {url:`https://facebook.com/${p.facebook}`, lbl:t('facebook'),sub:p.facebook, icon:'fab fa-facebook',ic:'fb-ic'},
      p.telegram&& {url:`https://t.me/${p.telegram}`,         lbl:t('telegram'),sub:p.telegram, icon:'fab fa-telegram',ic:'tg-ic'},
      p.instagram&&{url:`https://instagram.com/${p.instagram}`,lbl:t('instagram'),sub:p.instagram,icon:'fab fa-instagram',ic:'ig-ic'},
    ].filter(Boolean);
    const links=socs.length
      ?socs.map(s=>`<a href="${s.url}" target="_blank" rel="noopener" class="pub-lnk">
          <div class="pub-lic ${s.ic}"><i class="${s.icon}"></i></div>
          <div><div style="font-weight:700">${s.lbl}</div><div style="font-size:.74rem;opacity:.65">@${s.sub}</div></div>
          <i class="fas fa-arrow-up-right-from-square" style="margin-${lang==='ku'?'right':'left'}:auto;opacity:.4;font-size:.72rem"></i>
        </a>`).join('')
      :`<p style="text-align:center;opacity:.4;font-size:.86rem;padding:18px">${lang==='ku'?'هیچ لینکێک زیادنەکراوە':'No links added yet'}</p>`;
    document.getElementById('app').innerHTML=`
      <div class="pub-pg" style="${css}">
        <div class="pub-bgimg" style="background-image:url('${tpl.img}')"></div>
        <div class="pub-bgoverlay" style="background:${overlayBg}"></div>
        <div class="pub-in">
          <div class="pub-hd">
            <div class="pub-av">${init}</div>
            <div class="pub-name">${esc(p.displayName||p.username)}</div>
            <div class="pub-handle">@${p.username}</div>
            ${p.bio?`<div class="pub-bio">${esc(p.bio)}</div>`:''}
          </div>
          <div class="pub-links">${links}</div>
          <div class="pub-ft">${t('madeWith')} <a href="${location.origin}${location.pathname}" target="_blank">${t('appName')} ✨</a></div>
        </div>
      </div>`;
  }catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="pg-ld"><p style="color:var(--err)">Failed to load.</p></div>'}
}
function notFound(un){

    <div style="font-size:3.5rem">😕</div>

      <div class="pay-step"><div class="ps-n">3</div><div class="ps-t">${t('payStep3')}</div></div>
    </div>
    <div class="divl"></div>
    <div class="fg"><label class="lbl">${t('fullName')} *</label>
      <input class="fi" type="text" id="py-nm" placeholder="${lang==='ku'?'ناوی تەواو':'Your full name'}"/></div>
    <div class="fg"><label class="lbl">${lang==='ku'?'ژمارەی تەلەفۆن':'Phone Number'} *</label>
      <input class="fi" type="tel" id="py-ph" placeholder="07xx xxx xxxx"/></div>
    <div class="fg"><label class="lbl">${t('payMethod')} *</label>
      <div class="mth-sel">
        <button class="mth-btn on" id="mf" onclick="selMth('fastpay')">⚡ FastPay</button>
        <button class="mth-btn" id="mfib" onclick="selMth('fib')">🏦 FIB</button>
      </div></div>
    <div class="fg"><label class="lbl">${t('payScreen')} *</label>
      <div class="upd" id="upd-area">
        <input type="file" id="py-file" accept="image/*" onchange="onFile(event)"/>
        <div id="upd-ph">
          <i class="fas fa-cloud-arrow-up" style="font-size:1.8rem;color:var(--muted);display:block;margin-bottom:7px"></i>
          <p class="ts tm">${t('tapUpload')}</p>
          <p style="font-size:.7rem;color:var(--muted);margin-top:3px">${t('jpgpng')}</p>
        </div>
        <img id="upd-prev"/>
      </div></div>

function selMth(m){payMethod=m;document.getElementById('mf').classList.toggle('on',m==='fastpay');document.getElementById('mfib').classList.toggle('on',m==='fib')}
function onFile(e){
  const f=e.target.files[0];if(!f)return;payFile=f;
  const pr=document.getElementById('upd-prev'),ph=document.getElementById('upd-ph');
  pr.src=URL.createObjectURL(f);pr.style.display='block';ph.style.display='none';
}
async function hPaySubmit(type,tplId){
  const nm=v('py-nm'),ph=v('py-ph');
  if(!nm){toast(t('nameReq'),'w');return}
  if(!ph){toast(t('phoneReq'),'w');return}
  if(!payFile){toast(t('ssReq'),'w');return}
  const btn=document.getElementById('py-btn');
  btn.disabled=true;btn.innerHTML=`<i class="fas fa-spinner fa-spin"></i> ${lang==='ku'?'دەنێردرێت…':'Processing…'}`;
  const oid=await submitPayment({nm,ph,method:payMethod,type,tplId:tplId||null,file:payFile});
  if(oid){btn.innerHTML='✅ '+t('submitted');setTimeout(()=>go('dashboard'),2200)}
  else{btn.disabled=false;btn.innerHTML=`<i class="fab fa-whatsapp"></i> ${t('submitWA')}`}
}

async function renderAdmin(){
  if(!S.ud?.isAdmin){go('dashboard');return}
  document.getElementById('app').innerHTML=navbar()+`
  <div class="pg"><div class="wrap-lg">
    <div class="pg-hd" style="padding:20px 0 14px"><div class="pg-h1">⚙️ ${t('adminPanel')}</div>
      <div class="pg-hint">${t('manageAll')}</div></div>
    <div id="adm-st"><div class="pg-ld" style="min-height:80px"><div class="spin"></div></div></div>
    <div class="adm-tabs">
      <button class="at-btn on" id="atab-orders"   onclick="swAdmTab('orders')">${t('orders')}</button>
      <button class="at-btn"   id="atab-users"     onclick="swAdmTab('users')">${t('users')}</button>
      <button class="at-btn"   id="atab-profiles"  onclick="swAdmTab('profiles')">${t('profiles')}</button>
    </div>
    <div id="adm-ct"><div class="pg-ld" style="min-height:80px"><div class="spin"></div></div></div>
    <br><br>
  </div></div>`;
  try{
    const[us,os,ps]=await Promise.all([db.collection('users').get(),db.collection('orders').get(),db.collection('profiles').get()]);
    const pend=os.docs.filter(d=>d.data().status==='pending').length;
    document.getElementById('adm-st').innerHTML=`<div class="adm-stats">
      <div class="st-card"><div class="st-n">${us.size}</div><div class="st-l">${t('users')}</div></div>
      <div class="st-card"><div class="st-n">${ps.size}</div><div class="st-l">${t('profiles')}</div></div>
      <div class="st-card"><div class="st-n">${os.size}</div><div class="st-l">${t('orders')}</div></div>
      <div class="st-card"><div class="st-n" style="color:var(--warn)">${pend}</div><div class="st-l">${lang==='ku'?'چاوەڕوان':'Pending'}</div></div>
    </div>`;
  }catch(e){}
  loadAdmTab('orders');
}
function swAdmTab(tab){
  document.querySelectorAll('.at-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('atab-'+tab)?.classList.add('on');
  document.getElementById('adm-ct').innerHTML='<div class="pg-ld" style="min-height:70px"><div class="spin"></div></div>';
  loadAdmTab(tab);
}
async function loadAdmTab(tab){
  const el=document.getElementById('adm-ct');
  try{
    if(tab==='orders'){
      const s=await db.collection('orders').orderBy('createdAt','desc').limit(80).get();
      const rows=s.docs.map(d=>d.data());
      if(!rows.length){el.innerHTML=`<div class="empty"><div class="empty-e">📭</div><div class="empty-t">${t('noOrders')}</div></div>`;return}
      el.innerHTML=`<div class="tbl-wrap"><table class="dt">
        <thead><tr><th>${t('users')}</th><th>Type</th><th>Method</th><th>Amount</th><th>Status</th><th>${t('payScreen')}</th><th>Action</th></tr></thead>
        <tbody>${rows.map(o=>`<tr>
          <td><div style="font-weight:700;font-size:.82rem">${esc(o.userName||'—')}</div>
              <div style="font-size:.7rem;color:var(--muted)">${esc(o.userEmail||'—')}</div>
              <div style="font-size:.68rem;color:var(--muted)">${esc(o.phone||'—')}</div></td>
          <td style="font-size:.78rem">${o.type==='template'?`🎨 ${o.templateId}`:'➕ Extra'}</td>
          <td style="font-size:.78rem;font-weight:700">${(o.paymentMethod||'').toUpperCase()}</td>
          <td style="font-weight:800;font-size:.82rem">${o.amount||'—'}</td>
          <td><span class="sb sb-${o.status==='approved'?'ok':o.status==='rejected'?'rej':'pend'}">${o.status}</span></td>
          <td>${o.screenshotBase64?`<img src="${o.screenshotBase64}" style="width:46px;height:46px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid var(--border)" onclick="viewImg(this.src)"/>`:'—'}</td>
          <td>${o.status==='pending'?`<div style="display:flex;gap:5px">
            <button class="btn btn-ok btn-sm" onclick="admApprove('${o.id}','${o.userId}','${o.type}','${o.templateId||''}')">✓</button>
            <button class="btn btn-d btn-sm" onclick="admReject('${o.id}')">✗</button></div>`:'—'}</td>
        </tr>`).join('')}</tbody></table></div>`;
    }else if(tab==='users'){
      const s=await db.collection('users').get();
      const rows=s.docs.map(d=>({uid:d.id,...d.data()}));
      el.innerHTML=`<div class="tbl-wrap"><table class="dt">
        <thead><tr><th>${lang==='ku'?'ناو':'Name'}</th><th>${t('email')}</th><th>${t('profiles')}</th><th>Extra</th><th>Templates</th></tr></thead>
        <tbody>${rows.map(u=>`<tr>
          <td style="font-weight:700">${esc(u.displayName||'—')}</td>
          <td style="font-size:.78rem">${esc(u.email||'—')}</td>
          <td style="text-align:center">${u.profileCount||0}</td>
          <td style="text-align:center">${u.extraProfilesPaid?`<span class="sb sb-ok">${t('unlocked')}</span>`:'—'}</td>
          <td style="font-size:.72rem">${(u.unlockedTemplates||[]).join(', ')||'—'}</td>
        </tr>`).join('')}</tbody></table></div>`;
    }else{
      const s=await db.collection('profiles').get();
      const rows=s.docs.map(d=>({id:d.id,...d.data()}));
      el.innerHTML=`<div class="tbl-wrap"><table class="dt">
        <thead><tr><th>${lang==='ku'?'ناوی بەکارهێنەر':'Username'}</th><th>${t('displayName')}</th><th>Template</th><th>User ID</th><th></th></tr></thead>
        <tbody>${rows.map(p=>{const tp=getTpl(p.template);return`<tr>
          <td><strong>@${p.username}</strong></td>
          <td>${esc(p.displayName||'—')}</td>
          <td>${tp.em} ${tp.nm}</td>
          <td style="font-size:.68rem;color:var(--muted);font-family:monospace">${(p.userId||'').slice(0,12)}…</td>
          <td><a href="#/p/${p.username}" target="_blank" class="btn btn-g btn-sm"><i class="fas fa-eye"></i></a></td>
        </tr>`}).join('')}</tbody></table></div>`;
    }
  }catch(e){
    el.innerHTML=`<div class="empty"><div class="empty-e">❌</div><div class="empty-t">${t('noNet')}</div></div>`;
  }
}
async function admApprove(oid,uid,type,tplId){
  try{
    const b=db.batch();
    b.update(db.collection('orders').doc(oid),{status:'approved'});
    if(type==='template'&&tplId)b.update(db.collection('users').doc(uid),{unlockedTemplates:firebase.firestore.FieldValue.arrayUnion(tplId)});
    else if(type==='extra-profile')b.update(db.collection('users').doc(uid),{extraProfilesPaid:true});
    await b.commit();toast(t('orderOk'),'s');loadAdmTab('orders');
  }catch(e){console.error('admApprove:',e);toast('Approve failed: '+(e.message||e.code||'permission error. Check Firestore rules.'),'e')}
}
async function admReject(oid){
  try{await db.collection('orders').doc(oid).update({status:'rejected'});toast(t('orderRej'),'i');loadAdmTab('orders')}
  catch(e){console.error('admReject:',e);toast('Reject failed: '+(e.message||e.code||''),'e')}
}
