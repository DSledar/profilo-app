<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="description" content="Profilo – Share all your social links in one beautiful page"/>
  <title>Profilo – Your Digital Identity</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070f;--surface:#0f0f1e;--card:#161626;--card2:#1c1c30;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#eeeeff;--muted:#7878a8;
  --primary:#7c6eff;--primary-d:#6052e0;--primary-glow:rgba(124,110,255,0.28);
  --accent:#ff6b9d;--success:#00d48e;--warn:#ffa836;--err:#ff4560;
  --r-xs:6px;--r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:26px;
  --sh:0 4px 28px rgba(0,0,0,0.55);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:var(--font)}
input,textarea,select{font-family:var(--font)}
a{color:inherit;text-decoration:none}
img{max-width:100%}

/* ── LAYOUT ── */
#app{min-height:100dvh}
.pg{min-height:100dvh}
.wrap{max-width:460px;margin:0 auto;padding:0 16px}
.wrap-lg{max-width:980px;margin:0 auto;padding:0 16px}

/* ── NAVBAR ── */
.nav{
  position:sticky;top:0;z-index:90;
  background:rgba(7,7,15,0.88);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid var(--border);
  height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;
}
.nav-logo{
  font-size:1.35rem;font-weight:900;letter-spacing:-.03em;cursor:pointer;
  background:linear-gradient(130deg,var(--primary),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.nav-r{display:flex;align-items:center;gap:10px}
.nav-av{
  width:34px;height:34px;border-radius:50%;cursor:pointer;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  display:flex;align-items:center;justify-content:center;
  font-size:.78rem;font-weight:800;color:#fff;flex-shrink:0;
  transition:transform .18s var(--ease);
}
.nav-av:hover{transform:scale(1.08)}

/* ── BUTTONS ── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:var(--r-sm);
  font-size:.88rem;font-weight:700;border:none;
  transition:all .18s var(--ease);white-space:nowrap;cursor:pointer;
}
.btn-p{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;box-shadow:0 0 22px var(--primary-glow)}
.btn-p:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 24px var(--primary-glow)}
.btn-s{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn-s:hover:not(:disabled){background:rgba(255,255,255,0.07);border-color:var(--border2)}
.btn-g{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-g:hover:not(:disabled){color:var(--text);border-color:var(--border2)}
.btn-d{background:rgba(255,69,96,.1);color:var(--err);border:1px solid rgba(255,69,96,.25)}
.btn-d:hover:not(:disabled){background:rgba(255,69,96,.18)}
.btn-ok{background:linear-gradient(135deg,#00d48e,#00b87a);color:#fff}
.btn-ok:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,212,142,.3)}
.btn-google{
  background:#fff;color:#3c4043;border:1.5px solid #dadce0;
  font-weight:700;font-size:.88rem;
  transition:all .18s var(--ease);
}
.btn-google:hover{background:#f8f9fa;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.btn-google img{width:18px;height:18px;flex-shrink:0}
.btn-lg{padding:14px 26px;font-size:.95rem}
.btn-blk{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

/* ── FORMS ── */
.fg{margin-bottom:17px}
.lbl{display:block;font-size:.73rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.fi{
  width:100%;background:rgba(255,255,255,0.04);
  border:1.5px solid var(--border);border-radius:var(--r-sm);
  padding:12px 15px;color:var(--text);font-size:.92rem;
  transition:all .18s var(--ease);outline:none;-webkit-appearance:none;
}
.fi:focus{border-color:var(--primary);background:rgba(124,110,255,.05);box-shadow:0 0 0 3px rgba(124,110,255,.13)}
.fi::placeholder{color:rgba(255,255,255,.22)}
textarea.fi{resize:vertical;min-height:88px;line-height:1.6}
.ig{position:relative}
.ig .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem;width:15px;text-align:center;pointer-events:none}
.ig input{padding-left:40px}
.fhint{font-size:.73rem;color:var(--muted);margin-top:5px}

/* ── CARD ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px}

/* ── TABS ── */
.tabs{display:flex;background:var(--surface);border-radius:var(--r-sm);padding:4px;margin-bottom:20px}
.tbn{flex:1;padding:9px;text-align:center;border-radius:calc(var(--r-sm) - 2px);font-size:.83rem;font-weight:700;color:var(--muted);background:transparent;border:none;cursor:pointer;transition:all .18s var(--ease)}
.tbn.on{background:var(--card);color:var(--text);box-shadow:var(--sh)}

/* ── TOAST ── */
#tc{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:9999;display:flex;flex-direction:column-reverse;gap:8px;
  width:calc(100% - 32px);max-width:350px;pointer-events:none;
}
.toast{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);
  padding:13px 16px;display:flex;align-items:flex-start;gap:11px;
  font-size:.86rem;line-height:1.45;box-shadow:var(--sh);
  animation:tIn .32s cubic-bezier(.34,1.56,.64,1);pointer-events:all;
}
.toast.rem{animation:tOut .22s ease forwards}
.tic{font-size:.95rem;flex-shrink:0;margin-top:1px}
.toast-s .tic{color:var(--success)}.toast-e .tic{color:var(--err)}
.toast-i .tic{color:var(--primary)}.toast-w .tic{color:var(--warn)}
@keyframes tIn{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}
@keyframes tOut{to{opacity:0;transform:translateY(8px) scale(.95)}}

/* ── MODAL ── */
.mbk{
  position:fixed;inset:0;background:rgba(0,0,0,.78);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  z-index:300;display:flex;align-items:center;justify-content:center;
  padding:16px;animation:bkIn .2s ease;
}
@keyframes bkIn{from{opacity:0}to{opacity:1}}
.mbox{
  background:var(--card);border:1px solid var(--border2);border-radius:var(--r-xl);
  padding:26px;width:100%;max-width:370px;position:relative;
  animation:mIn .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes mIn{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.mcl{
  position:absolute;top:13px;right:13px;width:28px;height:28px;
  border-radius:50%;background:rgba(255,255,255,.07);border:none;
  color:var(--muted);display:flex;align-items:center;justify-content:center;
  font-size:.8rem;cursor:pointer;transition:all .18s var(--ease);
}
.mcl:hover{background:rgba(255,255,255,.13);color:var(--text)}
.mttl{font-size:1.05rem;font-weight:800;margin-bottom:16px}

/* ── LANDING ── */
.land{
  min-height:100dvh;
  background:radial-gradient(ellipse 70% 55% at 50% -5%,rgba(124,110,255,.2) 0%,transparent 65%),
             radial-gradient(ellipse 45% 45% at 85% 90%,rgba(255,107,157,.12) 0%,transparent 55%),
             var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;
}
.land-logo-wrap{margin-bottom:32px;text-align:center}
.land-logo{
  font-size:2.9rem;font-weight:900;letter-spacing:-.04em;display:block;
  background:linear-gradient(130deg,var(--primary),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.land-tag{color:var(--muted);font-size:.92rem;margin-top:7px}
.auth-card{width:100%;max-width:395px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);padding:28px 24px}

/* ── DASHBOARD ── */
.dash-hd{padding:26px 16px 16px}
.dash-hi{font-size:1.5rem;font-weight:900;letter-spacing:-.02em;margin-bottom:3px}
.dash-sub{color:var(--muted);font-size:.86rem}

.pc{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:11px;transition:all .2s var(--ease)}
.pc:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:var(--sh)}
.pc-top{display:flex;align-items:center;gap:13px;margin-bottom:13px}
.pc-av{
  width:48px;height:48px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  display:flex;align-items:center;justify-content:center;
  font-size:1.05rem;font-weight:800;color:#fff;
}
.pc-inf{flex:1;min-width:0}
.pc-name{font-size:.95rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.pc-usr{font-size:.76rem;color:var(--muted)}
.pc-tpl{font-size:.68rem;padding:3px 9px;border-radius:20px;font-weight:700;background:rgba(124,110,255,.12);color:var(--primary);border:1px solid rgba(124,110,255,.2);white-space:nowrap}
.pc-acts{display:flex;gap:7px;flex-wrap:wrap}

/* ── LIMIT BAR ── */
.lim{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:15px;margin-bottom:16px}
.lim-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.82rem}
.lim-bar{height:5px;background:rgba(255,255,255,.06);border-radius:10px;overflow:hidden}
.lim-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:10px;transition:width .5s ease}

/* ── CREATE / EDIT ── */
.cr-pg{padding-bottom:60px}
.pg-hd{padding:26px 16px 0}
.pg-back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:.83rem;margin-bottom:11px;cursor:pointer;transition:color .18s var(--ease)}
.pg-back:hover{color:var(--text)}
.pg-h1{font-size:1.5rem;font-weight:900;letter-spacing:-.02em;margin-bottom:3px}
.pg-hint{color:var(--muted);font-size:.84rem}

.sep{display:flex;align-items:center;gap:10px;margin:18px 0 14px}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--border)}
.sep-lbl{font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}

/* ── TEMPLATES ── */
.tpl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.tpl-card{border-radius:var(--r-md);border:2px solid var(--border);overflow:hidden;cursor:pointer;transition:all .18s var(--ease);position:relative}
.tpl-card.sel{border-color:var(--primary);box-shadow:0 0 0 3px rgba(124,110,255,.22)}
.tpl-card.lkd{cursor:default}
.tpl-card:not(.lkd):not(.sel):hover{border-color:var(--border2);transform:translateY(-2px)}
.tpl-prev{height:70px;display:flex;align-items:center;justify-content:center;font-size:1.7rem;position:relative}
.tpl-meta{padding:8px 10px;background:rgba(0,0,0,.32)}
.tpl-nm{font-size:.76rem;font-weight:800;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdg{display:inline-flex;align-items:center;gap:3px;font-size:.64rem;font-weight:800;padding:2px 7px;border-radius:20px}
.bdg-f{background:rgba(0,212,142,.14);color:var(--success)}
.bdg-p{background:rgba(255,168,54,.14);color:var(--warn)}
.bdg-u{background:rgba(124,110,255,.14);color:var(--primary)}
.lk-ov{position:absolute;inset:0;background:rgba(0,0,0,.52);display:flex;align-items:center;justify-content:center}
.lk-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,168,54,.15);border:1px solid rgba(255,168,54,.35);display:flex;align-items:center;justify-content:center;color:var(--warn);font-size:.85rem;cursor:pointer;transition:all .18s var(--ease)}
.lk-btn:hover{background:rgba(255,168,54,.28)}

/* ── PUBLIC PROFILE ── */
.pub-pg{min-height:100dvh;background:var(--p-bg,#0d1117);display:flex;flex-direction:column;align-items:center;padding:44px 16px 64px}
.pub-in{width:100%;max-width:420px}
.pub-hd{text-align:center;margin-bottom:30px}
.pub-av{
  width:88px;height:88px;border-radius:50%;
  background:var(--p-av-bg,#21262d);color:var(--p-av-tx,#58a6ff);
  display:flex;align-items:center;justify-content:center;
  font-size:1.9rem;font-weight:900;margin:0 auto 15px;
  border:3px solid var(--p-btn-br,#30363d);
}
.pub-name{font-family:var(--font);color:var(--p-tx,#f0f6fc);font-size:1.45rem;font-weight:900;letter-spacing:-.02em;margin-bottom:3px}
.pub-handle{color:var(--p-sub,#8b949e);font-size:.84rem}
.pub-bio{color:var(--p-sub,#8b949e);font-size:.9rem;margin-top:12px;line-height:1.65}
.pub-links{display:flex;flex-direction:column;gap:11px}
.pub-lnk{
  display:flex;align-items:center;gap:13px;
  padding:14px 18px;
  background:var(--p-btn-bg,#21262d);
  border:1.5px solid var(--p-btn-br,#30363d);
  border-radius:14px;
  color:var(--p-btn-tx,#f0f6fc);
  font-family:var(--font);font-size:.9rem;font-weight:700;
  cursor:pointer;transition:all .18s ease;text-decoration:none;
}
.pub-lnk:hover{background:var(--p-btn-hv,#30363d);transform:translateY(-2px)}
.pub-lic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0}
.sn-ic{background:rgba(255,252,0,.15);color:#FFFC00}
.tk-ic{background:rgba(255,255,255,.1);color:#fff}
.fb-ic{background:rgba(24,119,242,.15);color:#1877F2}
.tg-ic{background:rgba(0,136,204,.15);color:#0088CC}
.ig-ic{background:rgba(228,64,95,.15);color:#E4405F}
.pub-ft{text-align:center;margin-top:46px;color:var(--p-sub,#8b949e);font-size:.75rem}
.pub-ft a{color:var(--p-acc,#58a6ff);font-weight:700}

/* ── QR MODAL ── */
.qr-wrap{text-align:center}
#qr-cv{display:flex;align-items:center;justify-content:center;padding:14px;background:#fff;border-radius:var(--r-md);margin:14px 0}
.qr-url{font-size:.75rem;color:var(--muted);word-break:break-all;margin-bottom:14px;padding:9px;background:rgba(255,255,255,.04);border-radius:var(--r-sm);border:1px solid var(--border)}
.qr-acts{display:flex;gap:8px}

/* ── PAYMENT ── */
.pay-pg{padding-bottom:60px}
.pay-box{background:rgba(124,110,255,.07);border:1px solid rgba(124,110,255,.22);border-radius:var(--r-md);padding:17px;margin-bottom:18px}
.pay-ttl{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--primary);margin-bottom:6px}
.pay-num{font-size:1.55rem;font-weight:900;letter-spacing:.04em}
.pay-steps{margin-bottom:4px}
.pay-step{display:flex;gap:13px;margin-bottom:14px}
.ps-n{width:27px;height:27px;border-radius:50%;background:rgba(124,110,255,.15);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:900;flex-shrink:0;margin-top:2px}
.ps-t{font-size:.86rem;color:var(--muted);line-height:1.55;padding-top:4px}
.mth-sel{display:flex;gap:10px;margin-bottom:14px}
.mth-btn{flex:1;padding:14px;border-radius:var(--r-sm);border:2px solid var(--border);background:transparent;color:var(--muted);font-weight:800;font-size:.88rem;cursor:pointer;transition:all .18s var(--ease);text-align:center}
.mth-btn.on{border-color:var(--primary);background:rgba(124,110,255,.1);color:var(--primary)}
.upd{border:2px dashed var(--border);border-radius:var(--r-md);padding:28px 16px;text-align:center;cursor:pointer;transition:all .18s var(--ease);position:relative}
.upd:hover,.upd.dg{border-color:var(--primary);background:rgba(124,110,255,.05)}
.upd input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
#upd-prev{max-width:170px;margin:11px auto 0;border-radius:var(--r-sm);display:none}

/* ── ADMIN ── */
.adm-pg{padding-bottom:60px}
.adm-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:18px}
.st-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:17px;text-align:center}
.st-n{font-size:1.9rem;font-weight:900;color:var(--primary);line-height:1;margin-bottom:3px}
.st-l{font-size:.72rem;color:var(--muted);font-weight:700}
.adm-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.at-btn{padding:7px 16px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:.8rem;font-weight:800;cursor:pointer;transition:all .18s var(--ease)}
.at-btn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.tbl-wrap{border-radius:var(--r-md);border:1px solid var(--border);overflow:hidden;overflow-x:auto;-webkit-overflow-scrolling:touch}
table.dt{width:100%;border-collapse:collapse;font-size:.83rem}
.dt th{text-align:left;padding:11px 13px;color:var(--muted);font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);white-space:nowrap}
.dt td{padding:11px 13px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.dt tr:last-child td{border-bottom:none}
.dt tbody tr:hover td{background:rgba(255,255,255,.02)}
.sb{padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:800}
.sb-pend{background:rgba(255,168,54,.12);color:var(--warn)}
.sb-ok{background:rgba(0,212,142,.12);color:var(--success)}
.sb-rej{background:rgba(255,69,96,.12);color:var(--err)}

/* ── LOADER & EMPTY ── */
.pg-ld{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-size:.88rem}
.spin{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:50px 20px}
.empty-e{font-size:3.5rem;margin-bottom:13px}
.empty-t{font-size:1.05rem;font-weight:800;margin-bottom:7px}
.empty-s{color:var(--muted);font-size:.86rem;margin-bottom:20px}

/* ── UTILS ── */
.hid{display:none!important}
.row{display:flex;align-items:center}
.col{flex-direction:column}
.jb{justify-content:space-between}
.g2{gap:8px}.g3{gap:12px}
.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}
.mb4{margin-bottom:16px}
.tc{text-align:center}
.tm{color:var(--muted)}
.ts{font-size:.83rem}
.fw{font-weight:800}
.w100{width:100%}
.div{height:1px;background:var(--border);margin:18px 0}
.or-div{display:flex;align-items:center;gap:11px;color:var(--muted);font-size:.76rem;margin:16px 0}
.or-div::before,.or-div::after{content:'';flex:1;height:1px;background:var(--border)}
.flex-1{flex:1}

/* ── RESPONSIVE ── */
@media(min-width:600px){
  .adm-stats{grid-template-columns:repeat(4,1fr)}
  .tpl-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:380px){

  if((ud.profileCount||0)>=max){ toast(`Profile limit reached (${max})`, 'e'); return null }

      template:data.template, snapchat:data.snapchat||'',

/* ═══════════════════════════════════════════
   IMAGE COMPRESSOR  (no Storage needed — free!)
   Shrinks screenshot → JPEG base64 stored in Firestore
═══════════════════════════════════════════ */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=e=>{
      const img=new Image();
      img.onerror=reject;
      img.onload=()=>{
        const MAX=900;
        let w=img.width, h=img.height;
        if(w>h){ if(w>MAX){h=Math.round(h*MAX/w);w=MAX} }
        else    { if(h>MAX){w=Math.round(w*MAX/h);h=MAX} }
        const cv=document.createElement('canvas');
        cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        resolve(cv.toDataURL('image/jpeg',0.65));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

    <div class="fg"><label class="lbl">Payment Screenshot *</label>
      <div class="upd" id="upd-area">
        <input type="file" id="py-file" accept="image/*" onchange="onFile(event)"/>
        <div id="upd-ph">
          <i class="fas fa-cloud-arrow-up" style="font-size:2rem;color:var(--muted);display:block;margin-bottom:8px"></i>
          <p class="ts tm">Tap to upload screenshot</p>
          <p style="font-size:.72rem;color:var(--muted);margin-top:4px">JPG or PNG</p>
        </div>
        <img id="upd-prev"/>
      </div></div>
    <button class="btn btn-ok btn-blk btn-lg" id="py-btn" onclick="hPaySubmit('${type}','${tplId||''}')">
      <i class="fab fa-whatsapp"></i> Submit & Open WhatsApp</button>
    <br><br>
  </div></div>`;
}
function selMth(m){
  payMethod=m;
  document.getElementById('mf').classList.toggle('on',m==='fastpay');
  document.getElementById('mfib').classList.toggle('on',m==='fib');
}
function onFile(e){
  const f=e.target.files[0]; if(!f) return;
  payFile=f;
  const pr=document.getElementById('upd-prev');
  const ph=document.getElementById('upd-ph');
  pr.src=URL.createObjectURL(f); pr.style.display='block'; ph.style.display='none';
}
async function hPaySubmit(type,tplId){
  const nm=v('py-nm'), ph=v('py-ph');
  if(!nm){toast('Enter your name.','w');return}
  if(!ph){toast('Enter your phone number.','w');return}
  if(!payFile){toast('Upload payment screenshot.','w');return}
  const btn=document.getElementById('py-btn');
  btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Processing…';
  const oid=await submitPayment({nm,ph,method:payMethod,type,tplId:tplId||null,file:payFile});
  if(oid){ btn.innerHTML='✅ Submitted!'; setTimeout(()=>go('dashboard'),2200) }
  else{ btn.disabled=false; btn.innerHTML='<i class="fab fa-whatsapp"></i> Submit & Open WhatsApp' }
}

/* ═══════════════════════════════════════════
   ADMIN PANEL
═══════════════════════════════════════════ */
let aTab='orders';
async function renderAdmin(){
  if(!S.ud?.isAdmin){ go('dashboard'); return }
  document.getElementById('app').innerHTML=navbar()+`
  <div class="adm-pg"><div class="wrap-lg">
    <div class="pg-hd"><div class="pg-h1">⚙️ Admin Panel</div><div class="pg-hint">Manage users, orders & profiles</div></div><br>
    <div id="adm-st"><div class="pg-ld" style="min-height:100px"><div class="spin"></div></div></div>
    <div class="adm-tabs">
      <button class="at-btn on" id="atab-orders"   onclick="swAdmTab('orders')">📦 Orders</button>
      <button class="at-btn"    id="atab-users"    onclick="swAdmTab('users')">👥 Users</button>
      <button class="at-btn"    id="atab-profiles" onclick="swAdmTab('profiles')">🔮 Profiles</button>
    </div>
    <div id="adm-ct"><div class="pg-ld" style="min-height:100px"><div class="spin"></div></div></div>
  </div></div>`;
  try{
    const [us,os,ps]=await Promise.all([
      db.collection('users').get(),
      db.collection('orders').get(),
      db.collection('profiles').get()
    ]);
    const pending=os.docs.filter(d=>d.data().status==='pending').length;
    document.getElementById('adm-st').innerHTML=`
      <div class="adm-stats">
        <div class="st-card"><div class="st-n">${us.size}</div><div class="st-l">Users</div></div>
        <div class="st-card"><div class="st-n">${ps.size}</div><div class="st-l">Profiles</div></div>
        <div class="st-card"><div class="st-n">${os.size}</div><div class="st-l">Orders</div></div>
        <div class="st-card"><div class="st-n" style="color:var(--warn)">${pending}</div><div class="st-l">Pending</div></div>
      </div>`;
  } catch(e){}
  loadAdmTab('orders');
}
function swAdmTab(t){
  aTab=t;
  document.querySelectorAll('.at-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('atab-'+t)?.classList.add('on');
  document.getElementById('adm-ct').innerHTML='<div class="pg-ld" style="min-height:80px"><div class="spin"></div></div>';
  loadAdmTab(t);
}
async function loadAdmTab(t){
  const el=document.getElementById('adm-ct');
  try{
    if(t==='orders'){
      const s=await db.collection('orders').orderBy('createdAt','desc').limit(80).get();
      const rows=s.docs.map(d=>d.data());
      if(!rows.length){ el.innerHTML='<div class="empty"><div class="empty-e">📭</div><div class="empty-t">No orders yet</div></div>'; return }
      el.innerHTML=`<div class="tbl-wrap"><table class="dt">
        <thead><tr><th>User</th><th>Type</th><th>Method</th><th>Amount</th><th>Status</th><th>Screenshot</th><th>Actions</th></tr></thead>
        <tbody>${rows.map(o=>`<tr>
          <td><div style="font-weight:800;font-size:.85rem">${esc(o.userName||'—')}</div>
              <div style="font-size:.73rem;color:var(--muted)">${esc(o.userEmail||'—')}</div>
              <div style="font-size:.7rem;color:var(--muted)">${esc(o.phone||'—')}</div></td>
          <td style="font-size:.8rem">${o.type==='template'?`🎨 ${o.templateId}`:'➕ Extra Profile'}</td>
          <td style="font-size:.8rem;font-weight:700">${(o.paymentMethod||'').toUpperCase()}</td>
          <td style="font-size:.8rem;font-weight:800">${o.amount||'—'}</td>
          <td><span class="sb sb-${o.status==='approved'?'ok':o.status==='rejected'?'rej':'pend'}">${o.status}</span></td>
          <td>${o.screenshotBase64
            ?`<img src="${o.screenshotBase64}"
                style="width:52px;height:52px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid var(--border)"
                onclick="viewImg(this.src)" title="Click to enlarge"/>`
            :'—'}</td>
          <td>${o.status==='pending'?`<div style="display:flex;gap:6px">
            <button class="btn btn-ok btn-sm" onclick="admApprove('${o.id}','${o.userId}','${o.type}','${o.templateId||''}')">✓</button>
            <button class="btn btn-d btn-sm" onclick="admReject('${o.id}')">✗</button>
          </div>`:'—'}</td>
        </tr>`).join('')}
        </tbody></table></div>`;
    } else if(t==='users'){
      const s=await db.collection('users').get();
      const rows=s.docs.map(d=>({uid:d.id,...d.data()}));
      el.innerHTML=`<div class="tbl-wrap"><table class="dt">
        <thead><tr><th>Name</th><th>Email</th><th>Profiles</th><th>Extra</th><th>Unlocked Templates</th></tr></thead>
        <tbody>${rows.map(u=>`<tr>
          <td style="font-weight:800">${esc(u.displayName||'—')}</td>
          <td style="font-size:.8rem">${esc(u.email||'—')}</td>
          <td style="text-align:center">${u.profileCount||0}</td>
          <td style="text-align:center">${u.extraProfilesPaid?'<span class="sb sb-ok">Yes</span>':'—'}</td>
          <td style="font-size:.75rem">${(u.unlockedTemplates||[]).join(', ')||'—'}</td>
        </tr>`).join('')}
        </tbody></table></div>`;
    } else {
      const s=await db.collection('profiles').get();
      const rows=s.docs.map(d=>({id:d.id,...d.data()}));
      el.innerHTML=`<div class="tbl-wrap"><table class="dt">
        <thead><tr><th>Username</th><th>Display Name</th><th>Template</th><th>User ID</th><th>View</th></tr></thead>
        <tbody>${rows.map(p=>{const tp=getTpl(p.template);return`<tr>
          <td><strong>@${p.username}</strong></td>
          <td>${esc(p.displayName||'—')}</td>
          <td>${tp.em} ${tp.nm}</td>
          <td style="font-size:.7rem;color:var(--muted);font-family:monospace">${(p.userId||'').slice(0,12)}…</td>
          <td><a href="#/p/${p.username}" target="_blank" class="btn btn-g btn-sm"><i class="fas fa-eye"></i></a></td>
        </tr>`}).join('')}
        </tbody></table></div>`;
    }
  } catch(e){
    console.error(e);
    el.innerHTML='<div class="empty"><div class="empty-e">❌</div><div class="empty-t">Failed to load</div></div>';
  }
}
async function admApprove(oid,uid,type,tplId){
  try{
    const b=db.batch();
    b.update(db.collection('orders').doc(oid),{status:'approved'});
    if(type==='template'&&tplId)
      b.update(db.collection('users').doc(uid),{unlockedTemplates:firebase.firestore.FieldValue.arrayUnion(tplId)});
    else if(type==='extra-profile')
      b.update(db.collection('users').doc(uid),{extraProfilesPaid:true});
    await b.commit();
    toast('Order approved! ✅','s'); loadAdmTab('orders');
  } catch(e){ toast('Failed to approve.','e') }
}
async function admReject(oid){
  try{
    await db.collection('orders').doc(oid).update({status:'rejected'});
    toast('Order rejected.','i'); loadAdmTab('orders');
  } catch(e){ toast('Failed to reject.','e') }
}

/* ── view full screenshot in modal ── */
function viewImg(src){
  modal(`
    <button class="mcl" onclick="closeMdl()"><i class="fas fa-times"></i></button>
    <div class="mttl">Payment Screenshot</div>
    <img src="${src}" style="width:100%;border-radius:var(--r-md);margin-top:4px"/>
  `);
}

const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
